name: sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      FIT_USERNAME: ${{ secrets.FIT_USERNAME }}
      FIT_PASSWORD: ${{ secrets.FIT_PASSWORD }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/*.py"
      - name: Install LibreOffice (old Office formats)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Get the state
        run: ci/state.sh pull
      - name: Write placeholders for the old files
        run: python3 ci/placeholders.py fit.db files
      - name: Scrape the posts
        run: uv run fit_archive.py sync
      - name: Scrape the documents
        run: uv run documents.py sync
      # Upload the files before the state, so the state never lists a file that no release has.
      - name: Upload the new files
        run: uv run pages/release_files.py fit.db files "$GITHUB_REPOSITORY"
      - name: Update the index
        run: uv run index.py --text-only
      - name: Save the state
        run: ci/state.sh push
      - name: Publish the dataset
        run: |
          python3 ci/dataset.py fit.db dlwms.db
          zstd -q -T0 -10 -f dlwms.db -o dlwms.db.zst
          gh release view dataset -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create dataset -R "$GITHUB_REPOSITORY" --latest=false --title dataset --notes "The posts and the document metadata as SQLite (zstd). The daily sync replaces it. See the README."
          gh release upload dataset -R "$GITHUB_REPOSITORY" dlwms.db.zst --clobber
      - name: Build the site
        run: |
          uv run pages/build.py index.db pages/.build
          npx -y pagefind@1.6.0 --site pages/.build/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages/.build/site
      - id: deploy
        uses: actions/deploy-pages@v4
